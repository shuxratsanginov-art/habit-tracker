<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zen Productivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <header class="zen-header">
            <div class="zen-title-row">
                <h1 id="page-title">Сегодня</h1>
                <div id="header-time" style="font-weight:700;font-size:14px;opacity:.8;letter-spacing:1px">00:00</div>
            </div>
            <div id="week-strip" class="week-strip"></div>
        </header>

        <main id="main-content">
            <!-- DASHBOARD -->
            <section id="page-dashboard" class="page">
                <div class="pulse-container">
                    <div class="pulse-card">
                        <span id="score-main" class="score-main">0%</span>
                        <span class="score-label">Пульс Продуктивности</span>
                        <div style="display:flex;justify-content:center;gap:24px;margin-top:32px">
                            <div>
                                <div id="h-count" style="font-size:18px;font-weight:800;color:var(--accent-primary)">0/0</div>
                                <div class="stat-label">Привычки</div>
                            </div>
                            <div style="width:1px;height:24px;background:var(--card-border)"></div>
                            <div>
                                <div id="t-count" style="font-size:18px;font-weight:800;color:var(--accent-secondary)">0/0</div>
                                <div class="stat-label">Задачи</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="ai-insight-box" class="ai-modal" style="display:none">
                    <div style="flex:1">
                        <div style="font-size:11px;font-weight:800;color:var(--accent-primary);text-transform:uppercase;margin-bottom:4px;letter-spacing:1.5px">Zen Инсайт</div>
                        <p id="ai-insight-text" style="font-size:13px;line-height:1.5;color:var(--text-secondary)"></p>
                    </div>
                </div>
                <div style="padding:0 20px 40px;text-align:center">
                    <p id="quote-text" style="font-size:15px;font-weight:400;opacity:.6;line-height:1.6"></p>
                    <div id="quote-author" style="font-size:10px;font-weight:800;color:var(--accent-primary);margin-top:12px;text-transform:uppercase;letter-spacing:1px"></div>
                </div>
            </section>

            <!-- HABITS -->
            <section id="page-habits" class="page" style="display:none">
                <div class="section-header"><h2>Привычки</h2>
                    <button class="btn-icon-add" id="btn-add-habit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <div id="habits-list" class="stack-list"></div>
            </section>

            <!-- TASKS -->
            <section id="page-tasks" class="page" style="display:none">
                <div class="section-header"><h2>Задачи</h2>
                    <button class="btn-icon-add" id="btn-add-task" style="background:var(--accent-secondary);box-shadow:var(--glow-secondary)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <div id="tasks-list" class="stack-list"></div>
            </section>

            <!-- FINANCE -->
            <section id="page-finance" class="page" style="display:none">
                <div class="section-header"><h2>Бюджет</h2>
                    <button class="btn-icon-add" id="btn-add-finance" style="background:var(--accent-gold);box-shadow:0 0 20px rgba(245,158,11,.3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <div class="pulse-card" style="margin:0 20px 24px;padding:24px;border-radius:28px">
                    <span id="balance-total" class="score-main" style="font-size:36px;color:var(--accent-gold)">0</span>
                    <span class="score-label" style="display:block;margin-top:4px">Баланс (UZS)</span>
                    <div style="display:flex;justify-content:space-between;margin-top:24px;text-align:left">
                        <div><div id="balance-income" style="font-size:16px;font-weight:800;color:var(--accent-secondary)">0</div><div class="stat-label">Доходы</div></div>
                        <div><div id="balance-expense" style="font-size:16px;font-weight:800;color:var(--accent-pink)">0</div><div class="stat-label">Расходы</div></div>
                    </div>
                </div>
                <div id="finance-list" class="stack-list"></div>
            </section>

            <!-- REFLECTION / JOURNAL -->
            <section id="page-reflect" class="page" style="display:none">
                <div class="section-header"><h2>Дневник</h2></div>
                <div class="reflect-block" style="padding:0 20px 20px">
                    <div class="reflect-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><span>Утренняя рефлексия</span></div>
                    <div class="reflect-card">
                        <label class="reflect-q">Что для меня главное сегодня?</label>
                        <textarea id="ref-am-main" class="reflect-input" placeholder="Моя главная цель..." rows="2"></textarea>
                        <label class="reflect-q">Настроение (1-5)</label>
                        <div id="ref-am-mood" class="mood-picker">
                            <button type="button" class="mood-btn" data-val="1">1</button>
                            <button type="button" class="mood-btn" data-val="2">2</button>
                            <button type="button" class="mood-btn" data-val="3">3</button>
                            <button type="button" class="mood-btn" data-val="4">4</button>
                            <button type="button" class="mood-btn" data-val="5">5</button>
                        </div>
                        <label class="reflect-q">За что я благодарен?</label>
                        <textarea id="ref-am-grateful" class="reflect-input" placeholder="3 вещи..." rows="2"></textarea>
                    </div>
                </div>
                <div class="reflect-block" style="padding:0 20px 20px">
                    <div class="reflect-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><span>Вечерняя рефлексия</span></div>
                    <div class="reflect-card">
                        <label class="reflect-q">Что прошло хорошо?</label>
                        <textarea id="ref-pm-good" class="reflect-input" placeholder="Мои достижения..." rows="2"></textarea>
                        <label class="reflect-q">Что можно улучшить?</label>
                        <textarea id="ref-pm-improve" class="reflect-input" placeholder="Что изменить..." rows="2"></textarea>
                        <label class="reflect-q">Чему я научился?</label>
                        <textarea id="ref-pm-learned" class="reflect-input" placeholder="Уроки дня..." rows="2"></textarea>
                    </div>
                </div>
                <button class="btn-primary" style="margin:0 20px 40px;width:calc(100% - 40px)" id="btn-save-reflect">Сохранить записи</button>
            </section>
        </main>

        <!-- NAV TABS (SVG icons) -->
        <nav class="zen-tabs">
            <a href="#" class="tab-item active" onclick="showPage('dashboard',event)">
                <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><span>Пульс</span></a>
            <a href="#" class="tab-item" onclick="showPage('habits',event)">
                <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span><span>Цели</span></a>
            <a href="#" class="tab-item" onclick="showPage('tasks',event)">
                <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span><span>Дела</span></a>
            <a href="#" class="tab-item" onclick="showPage('finance',event)">
                <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg></span><span>Бюджет</span></a>
            <a href="#" class="tab-item" onclick="showPage('reflect',event)">
                <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg></span><span>Дневник</span></a>
        </nav>

        <!-- MODAL (static fields) -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-sheet" id="modal-sheet">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
                    <h2 id="modal-title" style="font-size:22px;font-weight:900">Новое</h2>
                    <button class="modal-close-btn" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                </div>
                <input type="text" id="m-name" placeholder="Название" autocomplete="off">
                <div id="m-finance-fields" style="display:none">
                    <input type="number" id="m-amount" placeholder="Сумма (сум)" autocomplete="off">
                    <select id="m-type"><option value="out">Расход</option><option value="in">Доход</option></select>
                </div>
                <select id="m-repeat">
                    <option value="none">Только этот день</option>
                    <option value="daily">Каждый день</option>
                    <option value="weekdays">По дням недели</option>
                    <option value="monthly">Раз в месяц</option>
                </select>
                <div id="m-weekdays" class="weekday-picker" style="display:none">
                    <button type="button" class="wd-btn" data-day="1">ПН</button>
                    <button type="button" class="wd-btn" data-day="2">ВТ</button>
                    <button type="button" class="wd-btn" data-day="3">СР</button>
                    <button type="button" class="wd-btn" data-day="4">ЧТ</button>
                    <button type="button" class="wd-btn" data-day="5">ПТ</button>
                    <button type="button" class="wd-btn" data-day="6">СБ</button>
                    <button type="button" class="wd-btn" data-day="7">ВС</button>
                </div>
                <button class="btn-primary" id="modal-save-btn">Сохранить</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
