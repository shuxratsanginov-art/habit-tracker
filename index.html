<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Привычки">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Мощный трекер привычек для ежедневной дисциплины">
    <title>Трекер Привычек</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-top">
                <div class="greeting">
                    <h1 id="greeting-text"></h1>
                    <p id="date-text" class="date-subtitle"></p>
                </div>
                <div class="header-actions">
                    <button id="stats-btn" class="icon-btn" aria-label="Статистика">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                    </button>
                </div>
            </div>
            <!-- Weekly Calendar Strip -->
            <div id="week-strip" class="week-strip"></div>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Progress Ring -->
            <div class="daily-progress-section">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 120 120">
                        <circle class="progress-ring-bg" cx="60" cy="60" r="52" />
                        <circle id="progress-ring-fill" class="progress-ring-fill" cx="60" cy="60" r="52" />
                    </svg>
                    <div class="progress-ring-text">
                        <span id="progress-percent" class="progress-percent">0%</span>
                        <span class="progress-label">выполнено</span>
                    </div>
                </div>
                <div class="daily-stats">
                    <div class="daily-stat">
                        <span id="completed-count" class="stat-value">0</span>
                        <span class="stat-label">сделано</span>
                    </div>
                    <div class="daily-stat-divider"></div>
                    <div class="daily-stat">
                        <span id="remaining-count" class="stat-value">0</span>
                        <span class="stat-label">осталось</span>
                    </div>
                    <div class="daily-stat-divider"></div>
                    <div class="daily-stat">
                        <span id="best-streak" class="stat-value">0</span>
                        <span class="stat-label">лучший стрик</span>
                    </div>
                </div>
            </div>

            <!-- Habits List -->
            <section id="habits-section" class="habits-section">
                <div class="section-header">
                    <h2>Сегодня</h2>
                    <span id="today-day-label" class="day-badge"></span>
                </div>
                <div id="habits-list" class="habits-list"></div>
            </section>

            <!-- Motivation Quote -->
            <div id="motivation" class="motivation-card">
                <p id="quote-text" class="quote-text"></p>
                <span id="quote-author" class="quote-author"></span>
            </div>
        </main>

        <!-- Stats Modal -->
        <div id="stats-modal" class="modal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Статистика</h2>
                    <button id="close-stats" class="icon-btn" aria-label="Закрыть">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div id="stats-content" class="stats-content"></div>
            </div>
        </div>

        <!-- Reflection Modal -->
        <div id="reflection-modal" class="modal">
            <div class="modal-backdrop"></div>
            <div class="modal-content reflection-content">
                <div class="modal-header">
                    <h2 id="reflection-title">Саморефлексия</h2>
                    <button id="close-reflection" class="icon-btn" aria-label="Закрыть">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="reflection-form">
                    <div id="reflection-prompts"></div>
                    <textarea id="reflection-text" class="reflection-textarea" placeholder="Напишите свои мысли..." rows="5"></textarea>
                    <div class="reflection-mood">
                        <p class="mood-label">Настроение:</p>
                        <div id="mood-selector" class="mood-selector">
                            <button class="mood-btn" data-mood="1" aria-label="Очень плохо">😫</button>
                            <button class="mood-btn" data-mood="2" aria-label="Плохо">😔</button>
                            <button class="mood-btn" data-mood="3" aria-label="Нормально">😐</button>
                            <button class="mood-btn" data-mood="4" aria-label="Хорошо">🙂</button>
                            <button class="mood-btn" data-mood="5" aria-label="Отлично">😊</button>
                        </div>
                    </div>
                    <button id="save-reflection" class="btn-primary">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
